name: hawwel
description: "E-Platform Solutions Secure Transfer and Logistics Application."
publish_to: "none"

version: 1.1.1+27

environment:
  sdk: ">=3.8.0-0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  socket_io_client: ^2.0.3+1
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3
  get_it: ^9.0.5
  google_fonts: ^6.3.2
  dotted_border: ^3.1.0
  file_picker: ^10.3.3
  pin_code_fields: ^8.0.1
  loader_overlay: ^4.0.2
  curved_navigation_bar: ^1.0.6
  convex_bottom_bar: ^3.2.0
  animated_bottom_navigation_bar: ^1.4.0
  dartz: ^0.10.1
  image_picker: ^1.2.1
  country_picker: ^2.0.27
  share_plus: ^12.0.1
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0

  screenshot: ^3.0.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  phone_numbers_parser: ^9.0.19
  qr_flutter: ^4.1.0
  flutter_image_compress: ^2.4.0
  path: ^1.9.1
  bidi: ^2.0.13
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  stylish_pull_to_refresh: ^1.2.0
  font_awesome_flutter: ^11.0.0

  bloc: ^9.2.1
  http_parser: ^4.1.2
  world_flags: ^2.9.1
  sealed_countries: ^2.8.0
  camera: ^0.12.0+2
  permission_handler: ^13.0.1

dependency_overrides:
  # permission_handler_android 14.0.0 requires a Kotlin Gradle Plugin/AGP
  # newer than this project's Gradle 8.12 setup and fails release builds
  # with "Unresolved reference: compilerOptions". Pin back to 13.0.1,
  # the version published alongside permission_handler ^13.0.1, until the
  # project's Android Gradle Plugin/Kotlin toolchain is upgraded.
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: asset/brand/app_icon_1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#001C1E"
  adaptive_icon_foreground: asset/brand/app_icon_adaptive_foreground.png

flutter_native_splash:
  color: "#001C1E"
  image: asset/brand/splash_center.png
  android_12:
    color: "#001C1E"
    image: asset/brand/splash_center.png
  ios: true
  android: true

flutter:
  uses-material-design: true

  assets:
    - asset/
    - asset/brand/
    - asset/hawwel_header_logo_800x200.webp
